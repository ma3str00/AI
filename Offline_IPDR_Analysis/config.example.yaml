# Copy to config.yaml. Change mysql.host when the database moves off this VM.

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "ipdr_ro"
  password: "change-me"
  database: "ipdr"

# llama-server.service already listens on 11434.
# The page also lists every server in engines.yaml. kind is llama.cpp or ollama.
llama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5-coder-3b-instruct-q4_k_m.gguf"
  timeout_seconds: 300
  sql_max_tokens: 220
  explain_max_tokens: 120
  # Two examples keep the prompt small enough for the 3B model on CPU.
  example_count: 2

# The Cloudflare quick-tunnel address. Change this when Kaggle prints a new URL.
# It replaces the address shipped in engines.yaml. Restart ipdr-assistant after editing.
kaggle:
  base_url: "https://bone-indexes-ensures-joe.trycloudflare.com"

server:
  # 8090 avoids the llama-server port. 0.0.0.0 accepts connections on every interface.
  host: "0.0.0.0"
  port: 8090

time:
  # utc_epoch: integers are real Unix time. Questions and display use GMT+5.
  # local_epoch: switch to this only if every answer is five hours off.
  stored_as: "utc_epoch"
  display_offset: "+05:00"

query:
  max_rows: 200
  max_execution_ms: 45000
  full_scan_execution_ms: 300000

paths:
  mapping_csv: "data/app_category_to_app_label_mapping.csv"
  examples_jsonl: "data/training_examples.jsonl"
  learned_jsonl: "data/learned_examples.jsonl"
