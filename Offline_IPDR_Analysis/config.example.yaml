# Copy to config.yaml. Point clickhouse.host at your production ClickHouse.

clickhouse:
  host: "127.0.0.1"
  # HTTP interface: 8123 (plain) or 8443 (TLS). Native protocol is not used.
  port: 8123
  user: "default"
  password: "change-me"
  database: "ipdr"
  secure: false

# llama-server.service already listens on 11434.
# The page also lists every server in engines.yaml. kind is llama.cpp or ollama.
llama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5-coder-3b-instruct-q4_k_m.gguf"
  timeout_seconds: 300
  sql_max_tokens: 220
  explain_max_tokens: 120
  # Two examples keep the prompt small enough for the 3B model on CPU.
  example_count: 2

# The Cloudflare tunnel address. Change this when Kaggle prints a new URL.
# It replaces the address shipped in engines.yaml. Restart ipdr-assistant after editing.
#
# trycloudflare.com quick tunnels often add 1–3 minute stalls on silent buffered POSTs
# even when Ollama itself finishes in ~10–15s. Prefer a named Cloudflare tunnel when
# possible. The app streams /api/chat and resets stale sockets to reduce that delay.
# Diagnose with: python scripts/probe_ollama_path.py
kaggle:
  base_url: "https://bone-indexes-ensures-joe.trycloudflare.com"

# Optional Ollama tuning for engines.yaml: num_ctx (8192) and keep_alive ("-1").
# On the Kaggle notebook also start ollama with OLLAMA_KEEP_ALIVE=-1.

server:
  # 8090 avoids the llama-server port. 0.0.0.0 accepts connections on every interface.
  host: "0.0.0.0"
  port: 8090

time:
  # utc_epoch: integers are real Unix time. Questions and display use GMT+5.
  # local_epoch: switch to this only if every answer is five hours off.
  stored_as: "utc_epoch"
  display_offset: "+05:00"

query:
  max_rows: 200
  max_execution_ms: 45000
  full_scan_execution_ms: 300000

paths:
  mapping_csv: "data/app_category_to_app_label_mapping.csv"
  examples_jsonl: "data/training_examples.jsonl"
  learned_jsonl: "data/learned_examples.jsonl"
