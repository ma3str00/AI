<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPDR login</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e7e2d8;
    --ink: #1b1914;
    --muted: #5c564c;
    --line: #d4cdc0;
    --panel: #fffcf7;
    --accent: #0c5c48;
    --accent-ink: #ffffff;
    --bad: #8d1d1d;
    --bad-bg: #fdecec;
    --header: #14352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 "Segoe UI", sans-serif; color: var(--ink);
    background:
      radial-gradient(900px 280px at 10% -10%, rgba(20, 53, 44, 0.08), transparent 60%),
      var(--bg);
  }
  .card {
    width: min(420px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 16px 40px rgba(27, 25, 20, 0.08);
  }
  h1 { margin: 0 0 6px; font: 600 28px/1.1 Georgia, "Times New Roman", serif; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: grid; gap: 6px; margin-bottom: 12px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: 16px/1.4 "Segoe UI", sans-serif; color: var(--ink); background: #fff;
  }
  button {
    width: 100%; margin-top: 8px; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 8px; padding: 12px 16px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error { display: none; background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .error.show { display: block; }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>IPDR analysis</h1>
    <p>Sign in to continue. Access is limited to registered users.</p>
    <div class="error" id="error"></div>
    <label>Username
      <input id="username" name="username" autocomplete="username" required>
    </label>
    <label>Password
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" id="submit">Sign in</button>
  </form>
<script>
const form = document.getElementById("login-form");
const error = document.getElementById("error");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.classList.remove("show");
  const button = document.getElementById("submit");
  button.disabled = true;
  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.detail || "Login failed");
    }
    window.location.href = "/";
  } catch (err) {
    error.textContent = String(err.message || err);
    error.classList.add("show");
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
