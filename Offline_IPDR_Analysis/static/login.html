<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPDR login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #eef1f4;
    --ink: #15202b;
    --muted: #5b6b7c;
    --line: #d5dde6;
    --panel: #ffffff;
    --accent: #0f6a5c;
    --accent-ink: #ffffff;
    --bad: #b42318;
    --bad-bg: #fef3f2;
    --font: "IBM Plex Sans", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.5 var(--font); color: var(--ink);
    background:
      radial-gradient(900px 320px at 8% -12%, rgba(15, 106, 92, 0.12), transparent 55%),
      radial-gradient(700px 280px at 100% 0%, rgba(15, 28, 39, 0.06), transparent 50%),
      linear-gradient(160deg, #0f1c27 0%, #163247 42%, #eef1f4 42.1%);
  }
  .card {
    width: min(420px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 30px 26px; box-shadow: 0 18px 48px rgba(15, 28, 39, 0.14);
  }
  .eyebrow {
    margin: 0 0 8px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
  }
  h1 { margin: 0 0 6px; font: 600 26px/1.15 var(--font); letter-spacing: -0.03em; }
  p { margin: 0 0 20px; color: var(--muted); }
  label {
    display: grid; gap: 6px; margin-bottom: 12px; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  input {
    width: 100%; border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 12px; font: 15px/1.4 var(--font); color: var(--ink); background: #f5f7fa;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus {
    outline: none; border-color: #7ab8ab; background: #fff;
    box-shadow: 0 0 0 3px rgba(15, 106, 92, 0.12);
  }
  button {
    width: 100%; margin-top: 8px; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 9px; padding: 12px 16px; font: 600 14px/1.2 var(--font); cursor: pointer;
    transition: background 0.12s ease;
  }
  button:hover:not(:disabled) { background: #0d5c50; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none; background: var(--bad-bg); color: var(--bad);
    border: 1px solid #f5c2c0; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <p class="eyebrow">Secure access</p>
    <h1>IPDR analysis</h1>
    <p>Sign in to continue. Access is limited to registered users.</p>
    <div class="error" id="error"></div>
    <label>Username
      <input id="username" name="username" autocomplete="username" required>
    </label>
    <label>Password
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" id="submit">Sign in</button>
  </form>
<script>
const form = document.getElementById("login-form");
const error = document.getElementById("error");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.classList.remove("show");
  const button = document.getElementById("submit");
  button.disabled = true;
  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.detail || data.error || "Sign-in failed");
    }
    window.location.href = "/";
  } catch (err) {
    error.textContent = err.message || "Sign-in failed";
    error.classList.add("show");
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
