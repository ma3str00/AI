<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPDR assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e7e2d8;
    --ink: #1b1914;
    --muted: #5c564c;
    --line: #d4cdc0;
    --panel: #fffcf7;
    --accent: #0c5c48;
    --accent-ink: #ffffff;
    --warn: #8a4b08;
    --warn-bg: #fff4e5;
    --bad: #8d1d1d;
    --bad-bg: #fdecec;
    --header: #14352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.5 "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 280px at 10% -10%, rgba(20, 53, 44, 0.08), transparent 60%),
      var(--bg);
    color: var(--ink);
  }
  header.top {
    background: var(--header);
    color: #f4f1ea;
    padding: 22px 20px 20px;
  }
  header.top h1 {
    font: 600 30px/1.1 Georgia, "Times New Roman", serif;
    margin: 0 0 6px;
    letter-spacing: -0.03em;
  }
  header.top p { margin: 0; max-width: 68ch; color: #d5e4de; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 72px; }
  h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .pill.bad { background: var(--bad-bg); border-color: #f0c4c4; color: var(--bad); }
  .pill.ok { border-color: #b7d8ce; }
  form {
    display: grid; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    box-shadow: 0 10px 30px rgba(27, 25, 20, 0.05);
  }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    font: inherit; color: inherit;
  }
  textarea:focus, select:focus { outline: 2px solid #b7d8ce; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 16px; font: inherit; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: 0.6; cursor: wait; }
  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit; min-width: 11rem;
  }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; }
  .starters button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-size: 13px; padding: 6px 10px; }
  section { margin-top: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .warning { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 13px/1.4 ui-monospace, Consolas, monospace;
  }
  .table-wrap { overflow: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: #efeae1; }
  .hidden { display: none; }
  .transcript { display: grid; gap: 14px; margin-top: 8px; }
  .bubble { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--panel); box-shadow: 0 8px 24px rgba(27, 25, 20, 0.04); }
  .bubble.user { background: #14352c; color: #f4f1ea; border-color: #14352c; }
  .bubble.user .who { color: #b7d8ce; }
  .who { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .bubble pre { margin-top: 10px; }
  .saved { color: var(--accent); font-size: 14px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .steps li { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
  .steps li::before { content: "✓"; color: var(--accent); font-weight: 700; }
  .steps li.current { color: var(--ink); font-weight: 600; }
  .steps li.current::before {
    content: ""; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%;
    border: 2px solid var(--accent); border-right-color: transparent;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chart-card { margin-top: 12px; }
  .chart-controls { display: grid; gap: 8px; margin-bottom: 10px; }
  .chart-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .chart-row span { min-width: 6.5rem; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .chart-row .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .chart-row button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  details.sql { margin-top: 12px; }
  details.sql summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="top">
  <h1>IPDR assistant</h1>
  <p>Ask a question, then keep going. A follow-up keeps the previous filters. Mark an answer correct and the assistant learns from that answer.</p>
</header>
<main>
  <div class="status" id="status"></div>
  <div class="transcript" id="transcript"></div>
  <form id="ask-form">
    <label for="question" id="question-label">Question</label>
    <textarea id="question" name="question" placeholder="Example: top app labels by download bytes yesterday"></textarea>
    <div class="row">
      <label for="engine">AI engine</label>
      <select id="engine" name="engine">
        <option value="local" data-kind="llama.cpp">Local 7B</option>
        <option value="kaggle" data-kind="ollama">Kaggle 14B</option>
      </select>
      <button type="submit" id="ask">Ask</button>
      <button type="button" class="secondary" id="reset">New conversation</button>
      <span id="busy" class="hidden">Working. A local question often takes half a minute to two minutes.</span>
    </div>
  </form>
  <div class="starters" id="starters"></div>
</main>
<script>
const question = document.getElementById("question");
const form = document.getElementById("ask-form");
const askButton = document.getElementById("ask");
const busy = document.getElementById("busy");
const transcript = document.getElementById("transcript");
const history = [];
let lastAnswer = null;

function chartDisplayRequest(text) {
  const question = text.toLowerCase();
  if (!/\b(bar chart|pie chart|chart|graph)\b/.test(question)) return false;
  if (/\b(top|highest|most|maximum|list|which|who|from|where|between|yesterday|today|application|applications|website|websites|city|cities|subscriber)\b/.test(question)) return false;
  return true;
}

function pill(text, kind) {
  const span = document.createElement("span");
  span.className = "pill" + (kind ? " " + kind : "");
  span.textContent = text;
  return span;
}

async function loadHealth() {
  const status = document.getElementById("status");
  status.replaceChildren();
  try {
    const response = await fetch("/api/health");
    const data = await response.json();
    const llama = data.llama || {};
    status.append(
      pill(data.mysql.ok ? "MySQL " + data.mysql.host : "MySQL down", data.mysql.ok ? "ok" : "bad"),
      pill(llama.ok ? (llama.label || "Local") + " · " + (llama.model || "") : "local model not ready", llama.ok ? "ok" : "bad"),
      pill(data.examples + " examples"),
      pill((data.learned || 0) + " learned"),
      pill(data.missing_time === "all" ? "learned: no time range uses whole table" : "no time range: asks until marked"),
      pill(data.labels + " app labels"),
      pill(data.time.note)
    );
    if (!data.mysql.ok) status.append(pill(data.mysql.detail, "bad"));
    if (llama.ok === false) status.append(pill(llama.detail, "bad"));
    const engines = Array.isArray(data.engines) ? data.engines : [];
    fillEngines(engines);
    if (!engines.length) status.append(pill("Engine list is missing. Restart ipdr-assistant, then reload.", "bad"));
    for (const engine of engines) {
      if (engine.id !== "local" && !engine.ok) status.append(pill(engine.label + " is not reachable", "bad"));
    }
    if (data.mapping_error) status.append(pill(data.mapping_error, "bad"));
  } catch (error) {
    status.append(pill(String(error), "bad"));
  }
}

async function loadStarters() {
  const box = document.getElementById("starters");
  const response = await fetch("/api/starters");
  const data = await response.json();
  for (const text of data.questions) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", () => {
      resetConversation();
      question.value = text;
      form.requestSubmit();
    });
    box.append(button);
  }
}

function fillEngines(engines) {
  if (!engines.length) return;
  const menu = document.getElementById("engine");
  const selected = menu.value;
  menu.replaceChildren();
  for (const engine of engines) {
    const option = document.createElement("option");
    option.value = engine.id;
    option.textContent = engine.label;
    option.dataset.kind = engine.kind;
    menu.append(option);
  }
  if (selected && menu.querySelector(`option[value="${selected}"]`)) menu.value = selected;
}

function addUserBubble(text) {
  const bubble = document.createElement("div");
  bubble.className = "bubble user";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "You";
  const body = document.createElement("div");
  body.textContent = text;
  bubble.append(who, body);
  transcript.append(bubble);
}

const CHART_COLORS = ["#0c5c48", "#c4841d", "#1f6f8b", "#8d3b3b", "#4d6b3c", "#6b4c7a", "#b65c38", "#3d5a4c"];

const LABEL_COLUMNS = new Set([
  "subscriber_id", "app_label", "app_category", "requested_server", "city", "loc", "geo",
  "client_asn", "server_asn", "client_location", "server_location", "block_type"
]);

function numberValue(value) {
  if (typeof value === "number" && Number.isFinite(value)) return value;
  if (typeof value !== "string") return null;
  const text = value.trim();
  if (!/^-?\d+(\.\d+)?$/.test(text) || /^0\d/.test(text)) return null;
  return Number(text);
}

function numericColumns(columns, rows) {
  return columns.filter((column) => {
    if (LABEL_COLUMNS.has(String(column).toLowerCase())) return false;
    const values = rows
      .map((row) => row[column])
      .filter((value) => value !== null && value !== undefined && String(value).trim() !== "");
    return values.length > 0 && values.every((value) => numberValue(value) !== null);
  });
}

function columnByName(numeric, names) {
  for (const wanted of names) {
    const found = numeric.find((column) => column.toLowerCase() === wanted);
    if (found) return found;
  }
  return null;
}

function measureFromQuestion(question, numeric) {
  const text = String(question || "");
  const rules = [
    {pattern: /\b(flow counts?|number of flows|hits)\b/gi, names: ["flow_count", "flows", "blocked_flows"]},
    {pattern: /\bflows\b/gi, names: ["flows", "flow_count", "blocked_flows"]},
    {pattern: /\b(traffic volume|volume|bytes|megabytes|total mb)\b/gi, names: ["traffic_volume_mb", "total_mb", "traffic_volume_gb", "total_gb", "traffic_volume_tb", "total_tb", "traffic_volume", "total_bytes"]},
    {pattern: /\b(user counts?|unique users|subscribers|users)\b/gi, names: ["users"]},
    {pattern: /\bwebsites\b/gi, names: ["websites"]}
  ];
  let chosen = null;
  for (const rule of rules) {
    const pattern = new RegExp(rule.pattern.source, "gi");
    let match;
    while ((match = pattern.exec(text))) {
      const column = columnByName(numeric, rule.names);
      if (column && (!chosen || match.index >= chosen.index)) chosen = {index: match.index, column};
    }
  }
  return chosen ? chosen.column : null;
}

function measureFromSql(sql, numeric) {
  const match = String(sql || "").match(/\border\s+by\s+`?([a-zA-Z0-9_]+)`?/i);
  if (!match) return null;
  return columnByName(numeric, [match[1].toLowerCase()]);
}

function chartFields(columns, rows, question, sql) {
  const numeric = numericColumns(columns, rows);
  const label = columns.find((column) => LABEL_COLUMNS.has(String(column).toLowerCase()))
    || columns.find((column) => !numeric.includes(column));
  if (!label || !numeric.length) return null;
  const preferred = ["flows", "flow_count", "blocked_flows", "users", "websites", "traffic_volume_mb", "total_mb", "traffic_volume_gb", "total_gb", "traffic_volume", "total_bytes"];
  const measure = measureFromQuestion(question, numeric) || measureFromSql(sql, numeric) || preferred.find((name) => numeric.includes(name)) || numeric[0];
  return {label, measure, numeric};
}

function chartRows(rows, measure) {
  return rows
    .slice()
    .sort((left, right) => (numberValue(right[measure]) || 0) - (numberValue(left[measure]) || 0))
    .slice(0, 12);
}

const MEASURE_LABELS = {
  total_bytes: "Total bytes",
  total_mb: "Total MB",
  total_gb: "Total GB",
  total_tb: "Total TB",
  flows: "Flows",
  flow_count: "Flow count",
  blocked_flows: "Blocked flows",
  users: "Users",
  websites: "Websites",
  traffic_volume: "Traffic volume",
  traffic_volume_mb: "Traffic volume (MB)",
  traffic_volume_gb: "Traffic volume (GB)",
  traffic_volume_tb: "Traffic volume (TB)"
};

function measureLabel(column) {
  return MEASURE_LABELS[column] || column.replace(/_/g, " ");
}

function choiceButton(label) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "secondary";
  button.textContent = label;
  return button;
}

function chartCard(columns, rows, question, sql, kind) {
  const fields = chartFields(columns, rows, question, sql);
  const card = document.createElement("div");
  card.className = "chart-card";
  if (!fields) return card;
  const controls = document.createElement("div");
  controls.className = "chart-controls";
  const measureButtons = fields.numeric.map((column) => {
    const button = choiceButton(measureLabel(column));
    button.dataset.measure = column;
    button.addEventListener("click", () => {
      fields.measure = column;
      draw(currentKind);
    });
    return button;
  });
  const barButton = choiceButton("Bar");
  const pieButton = choiceButton("Pie");
  const plot = document.createElement("div");
  const note = document.createElement("p");
  note.className = "chart-note";
  let currentKind = kind === "pie" ? "pie" : "bar";
  function draw(nextKind) {
    currentKind = nextKind;
    const shown = chartRows(rows, fields.measure);
    const label = measureLabel(fields.measure);
    for (const button of measureButtons) button.classList.toggle("active", button.dataset.measure === fields.measure);
    barButton.classList.toggle("active", nextKind === "bar");
    pieButton.classList.toggle("active", nextKind === "pie");
    plot.replaceChildren(nextKind === "pie" ? pieChart(shown, fields) : barChart(shown, fields));
    note.textContent = rows.length > shown.length
      ? "Largest " + shown.length + " of " + rows.length + " rows, by " + label + "."
      : "Ordered by " + label + ", largest first.";
  }
  barButton.addEventListener("click", () => draw("bar"));
  pieButton.addEventListener("click", () => draw("pie"));
  controls.append(
    controlRow("Chart type", [barButton, pieButton]),
    controlRow("Measure", measureButtons)
  );
  card.append(controls, plot, note);
  draw(currentKind);
  return card;
}

function controlRow(name, buttons) {
  const row = document.createElement("div");
  row.className = "chart-row";
  const label = document.createElement("span");
  label.textContent = name;
  const choices = document.createElement("div");
  choices.className = "choices";
  choices.append(...buttons);
  row.append(label, choices);
  return row;
}

function barChart(rows, fields) {
  const width = 720;
  const rowHeight = 28;
  const labelWidth = 168;
  const height = rows.length * rowHeight + 16;
  const values = rows.map((row) => Math.max(0, numberValue(row[fields.measure]) || 0));
  const max = Math.max(...values, 1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("class", "chart-svg");
  rows.forEach((row, index) => {
    const value = values[index];
    const y = 8 + index * rowHeight;
    const barWidth = ((width - labelWidth - 88) * value) / max;
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", "0");
    label.setAttribute("y", String(y + 16));
    label.setAttribute("fill", "#1b1914");
    label.setAttribute("font-size", "12");
    label.textContent = String(row[fields.label] ?? "").slice(0, 24);
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", String(labelWidth));
    rect.setAttribute("y", String(y));
    rect.setAttribute("width", String(Math.max(barWidth, 2)));
    rect.setAttribute("height", "18");
    rect.setAttribute("rx", "4");
    rect.setAttribute("fill", CHART_COLORS[index % CHART_COLORS.length]);
    const amount = document.createElementNS("http://www.w3.org/2000/svg", "text");
    amount.setAttribute("x", String(labelWidth + barWidth + 8));
    amount.setAttribute("y", String(y + 14));
    amount.setAttribute("fill", "#5c564c");
    amount.setAttribute("font-size", "12");
    amount.textContent = String(row[fields.measure]);
    svg.append(label, rect, amount);
  });
  return svg;
}

function pieChart(rows, fields) {
  const values = rows.map((row) => Math.max(0, numberValue(row[fields.measure]) || 0));
  const total = values.reduce((sum, value) => sum + value, 0) || 1;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 720 280");
  svg.setAttribute("class", "chart-svg");
  let angle = -Math.PI / 2;
  values.forEach((value, index) => {
    const slice = (value / total) * Math.PI * 2;
    const end = angle + slice;
    const large = slice > Math.PI ? 1 : 0;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const x1 = 120 + Math.cos(angle) * 90;
    const y1 = 140 + Math.sin(angle) * 90;
    const x2 = 120 + Math.cos(end) * 90;
    const y2 = 140 + Math.sin(end) * 90;
    path.setAttribute("d", `M 120 140 L ${x1} ${y1} A 90 90 0 ${large} 1 ${x2} ${y2} Z`);
    path.setAttribute("fill", CHART_COLORS[index % CHART_COLORS.length]);
    svg.append(path);
    const legend = document.createElementNS("http://www.w3.org/2000/svg", "text");
    legend.setAttribute("x", "240");
    legend.setAttribute("y", String(36 + index * 22));
    legend.setAttribute("fill", "#1b1914");
    legend.setAttribute("font-size", "13");
    const share = Math.round((value / total) * 100);
    legend.textContent = String(rows[index][fields.label] ?? "").slice(0, 32) + " · " + share + "%";
    const swatch = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    swatch.setAttribute("x", "220");
    swatch.setAttribute("y", String(24 + index * 22));
    swatch.setAttribute("width", "12");
    swatch.setAttribute("height", "12");
    swatch.setAttribute("rx", "2");
    swatch.setAttribute("fill", CHART_COLORS[index % CHART_COLORS.length]);
    svg.append(swatch, legend);
    angle = end;
  });
  return svg;
}

function startProgress() {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "Assistant";
  const list = document.createElement("ol");
  list.className = "steps";
  bubble.append(who, list);
  transcript.append(bubble);
  bubble.scrollIntoView({block: "nearest"});
  return {
    add(text) {
      for (const item of list.querySelectorAll("li")) item.classList.remove("current");
      const step = document.createElement("li");
      step.className = "current";
      step.textContent = text;
      list.append(step);
    },
    finish() {
      for (const item of list.querySelectorAll("li")) item.classList.remove("current");
      bubble.remove();
    }
  };
}

function addAnswerBubble(asked, data) {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "Assistant";
  bubble.append(who);
  if (data.warning) {
    const warning = document.createElement("div");
    warning.className = "warning";
    warning.textContent = data.warning;
    bubble.append(warning);
  }
  if (data.error) {
    const error = document.createElement("div");
    error.className = "error";
    error.textContent = data.error;
    bubble.append(error);
  }
  const text = document.createElement("div");
  text.textContent = data.explanation || data.clarify || "";
  bubble.append(text);
  if (data.columns && data.columns.length && data.rows && data.rows.length) {
    bubble.append(chartCard(
      data.columns,
      data.rows,
      data.chartQuestion || asked,
      data.sql,
      /\bpie\b/i.test(asked) ? "pie" : "bar"
    ));
    if (!data.chartQuestion) lastAnswer = {question: asked, data};
  }
  if (data.sql) {
    const details = document.createElement("details");
    details.className = "sql";
    const summary = document.createElement("summary");
    summary.textContent = "SQL";
    const sql = document.createElement("pre");
    sql.textContent = data.sql;
    details.append(summary, sql);
    bubble.append(details);
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "10px";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "secondary";
    copy.textContent = "Copy SQL";
    copy.addEventListener("click", () => navigator.clipboard.writeText(data.sql));
    const learn = document.createElement("button");
    learn.type = "button";
    learn.className = "secondary";
    learn.textContent = "Mark correct";
    learn.addEventListener("click", () => markCorrect(asked, data.sql, learn));
    row.append(copy, learn);
    bubble.append(row);
  }
  if (data.columns && data.columns.length && data.rows && data.rows.length) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    wrap.style.marginTop = "10px";
    const table = document.createElement("table");
    const head = document.createElement("tr");
    const numberHead = document.createElement("th");
    numberHead.textContent = "#";
    head.append(numberHead);
    for (const column of data.columns) {
      const cell = document.createElement("th");
      cell.textContent = column;
      head.append(cell);
    }
    table.append(head);
    data.rows.forEach((record, index) => {
      const line = document.createElement("tr");
      const number = document.createElement("td");
      number.textContent = String(index + 1);
      line.append(number);
      for (const column of data.columns) {
        const cell = document.createElement("td");
        const value = record[column];
        cell.textContent = value === null || value === undefined ? "" : String(value);
        if (typeof value === "number") cell.className = "num";
        line.append(cell);
      }
      table.append(line);
    });
    wrap.append(table);
    bubble.append(wrap);
  }
  transcript.append(bubble);
  bubble.scrollIntoView({block: "nearest"});
}

async function markCorrect(asked, sql, button) {
  button.disabled = true;
  try {
    const questions = history.filter((turn) => !turn.sql).map((turn) => turn.question);
    questions.push(asked);
    const response = await fetch("/api/learn", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: asked, sql, questions})
    });
    const data = await response.json();
    if (!response.ok) {
      button.disabled = false;
      button.textContent = data.detail || "Could not save";
      return;
    }
    const savedText = data.learned_time_rule
      ? "Saved. A question with no time range now runs on all of the data."
      : "Saved. The same question will run this query.";
    button.replaceWith(Object.assign(document.createElement("span"), {className: "saved", textContent: savedText}));
    loadHealth();
  } catch (error) {
    button.disabled = false;
    button.textContent = String(error);
  }
}

function detailText(detail) {
  if (!detail) return "Request failed";
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    return detail.map((item) => (item && item.msg) || JSON.stringify(item)).join(" ");
  }
  return JSON.stringify(detail);
}

function resetConversation() {
  history.length = 0;
  lastAnswer = null;
  transcript.replaceChildren();
  document.getElementById("question-label").textContent = "Question";
  question.placeholder = "Example: top app labels by download bytes yesterday";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = question.value.trim();
  if (!text) return;
    const prior = history.slice(-12).map((turn) => ({
      question: turn.question,
      sql: (turn.sql || "").slice(0, 100000),
      explanation: (turn.explanation || "").slice(0, 500)
    }));
  addUserBubble(text);
  question.value = "";
  if (chartDisplayRequest(text) && lastAnswer && lastAnswer.data.rows && lastAnswer.data.rows.length) {
    addAnswerBubble(text, {
      explanation: "This charts the rows already shown.",
      columns: lastAnswer.data.columns,
      rows: lastAnswer.data.rows,
      sql: lastAnswer.data.sql,
      chartQuestion: lastAnswer.question + "\n" + text
    });
    question.focus();
    return;
  }
  const menu = document.getElementById("engine");
  askButton.disabled = true;
  busy.classList.add("hidden");
  const progress = startProgress();
  progress.add("Sending the question");
  try {
    const response = await fetch("/api/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, history: prior, engine: menu.value || "local"})
    });
    const type = response.headers.get("content-type") || "";
    if (!type.includes("ndjson")) {
      const raw = await response.text();
      progress.finish();
      let data;
      try { data = JSON.parse(raw); } catch (error) {
        addAnswerBubble(text, {error: raw.slice(0, 500) || String(error), explanation: ""});
        return;
      }
      addAnswerBubble(text, !response.ok ? {error: detailText(data.detail), explanation: ""} : data);
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let result = null;
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === "status") progress.add(event.text);
        if (event.type === "done") result = event.result;
      }
    }
    progress.finish();
    const data = result || {error: "The assistant stopped before returning an answer.", explanation: ""};
    addAnswerBubble(text, data);
    if (!data.error) {
      history.push({
        question: text,
        sql: data.sql || "",
        explanation: data.explanation || data.clarify || data.error || ""
      });
      document.getElementById("question-label").textContent = "Follow-up";
      question.placeholder = "Ask about the same result, or change one part of it";
    }
  } catch (error) {
    progress.finish();
    addAnswerBubble(text, {error: String(error), explanation: ""});
  } finally {
    askButton.disabled = false;
    busy.classList.add("hidden");
    question.focus();
  }
});

document.getElementById("reset").addEventListener("click", resetConversation);

loadHealth();
loadStarters();
</script>
