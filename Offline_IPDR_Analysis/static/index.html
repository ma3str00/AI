<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPDR assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e7e2d8;
    --ink: #1b1914;
    --muted: #5c564c;
    --line: #d4cdc0;
    --panel: #fffcf7;
    --accent: #0c5c48;
    --accent-ink: #ffffff;
    --warn: #8a4b08;
    --warn-bg: #fff4e5;
    --bad: #8d1d1d;
    --bad-bg: #fdecec;
    --header: #14352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.5 "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 280px at 10% -10%, rgba(20, 53, 44, 0.08), transparent 60%),
      var(--bg);
    color: var(--ink);
  }
  header.top {
    background: var(--header);
    color: #f4f1ea;
    padding: 22px 20px 20px;
    display: flex;
    gap: 16px;
    justify-content: space-between;
    align-items: flex-start;
  }
  header.top .brand { min-width: 0; }
  header.top h1 {
    font: 600 30px/1.1 Georgia, "Times New Roman", serif;
    margin: 0 0 6px;
    letter-spacing: -0.03em;
  }
  header.top p { margin: 0; max-width: 68ch; color: #d5e4de; }
  header.top .debug-toggle {
    flex: 0 0 auto;
    background: transparent;
    color: #d5e4de;
    border: 1px solid rgba(213, 228, 222, 0.45);
    border-radius: 8px;
    padding: 8px 12px;
    font: 13px/1.2 "Segoe UI", sans-serif;
    white-space: nowrap;
  }
  header.top .debug-toggle.on {
    background: rgba(183, 216, 206, 0.18);
    color: #f4f1ea;
    border-color: #b7d8ce;
  }
  .steps li .step-time {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .bubble.debug-log { border-style: dashed; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 72px; }
  h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .pill.bad { background: var(--bad-bg); border-color: #f0c4c4; color: var(--bad); }
  .pill.ok { border-color: #b7d8ce; }
  form {
    display: grid; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    box-shadow: 0 10px 30px rgba(27, 25, 20, 0.05);
  }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    font: inherit; color: inherit;
  }
  textarea:focus, select:focus { outline: 2px solid #b7d8ce; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 16px; font: inherit; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: 0.6; cursor: wait; }
  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit; min-width: 11rem;
  }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; }
  .starters button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-size: 13px; padding: 6px 10px; }
  section { margin-top: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .warning { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 13px/1.4 ui-monospace, Consolas, monospace;
  }
  .table-wrap { overflow: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: #efeae1; }
  .hidden { display: none; }
  .transcript { display: grid; gap: 14px; margin-top: 8px; }
  .bubble { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--panel); box-shadow: 0 8px 24px rgba(27, 25, 20, 0.04); }
  .confirm-card { margin: 0; }
  .confirm-card .confirm-lead { margin: 0 0 12px; color: var(--ink); }
  .confirm-card .confirm-ask {
    margin: 6px 0 0; padding: 10px 12px; border-radius: 10px;
    background: #f3efe7; border: 1px solid var(--line); font-weight: 600;
  }
  .confirm-card h3 {
    margin: 16px 0 8px; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  .confirm-card h3:first-of-type { margin-top: 4px; }
  .confirm-grid {
    display: grid; grid-template-columns: 8.5rem 1fr; gap: 8px 12px;
    margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: #fffcf7;
  }
  .confirm-grid dt {
    margin: 0; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); padding-top: 2px;
  }
  .confirm-grid dd { margin: 0; color: var(--ink); font-weight: 500; }
  .confirm-columns { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .confirm-columns li {
    border: 1px solid #cfe0da; background: #eef6f3; color: #14352c;
    border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500;
  }
  .confirm-card .confirm-foot { margin: 14px 0 0; color: var(--muted); }
  .bubble.user { background: #14352c; color: #f4f1ea; border-color: #14352c; }
  .bubble.user .who { color: #b7d8ce; }
  .who { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .bubble pre { margin-top: 10px; }
  .saved { color: var(--accent); font-size: 14px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .steps li { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
  .steps li::before { content: "✓"; color: var(--accent); font-weight: 700; }
  .steps li.current { color: var(--ink); font-weight: 600; }
  .steps li.current::before {
    content: ""; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%;
    border: 2px solid var(--accent); border-right-color: transparent;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chart-card { margin-top: 12px; }
  .chart-controls { display: grid; gap: 8px; margin-bottom: 10px; }
  .chart-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .chart-row span { min-width: 6.5rem; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .chart-row .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .chart-row button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-plot { position: relative; }
  .chart-tooltip {
    position: absolute;
    z-index: 5;
    min-width: 10rem;
    max-width: 18rem;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255, 252, 247, 0.97);
    box-shadow: 0 10px 28px rgba(27, 25, 20, 0.12);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.35;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, calc(-100% - 10px));
    transition: opacity 0.12s ease;
  }
  .chart-tooltip.visible { opacity: 1; }
  .chart-tooltip strong { display: block; margin-bottom: 2px; }
  .chart-hit { cursor: pointer; transition: opacity 0.12s ease, filter 0.12s ease; }
  .chart-svg.is-hovering .chart-hit { opacity: 0.32; }
  .chart-svg.is-hovering .chart-hit.is-active { opacity: 1; filter: brightness(1.08); }
  .chart-hit.is-active { stroke: #1b1914; stroke-width: 2; }
  .chart-note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  details.sql, details.chart, details.table { margin-top: 12px; }
  details.sql summary, details.chart summary, details.table summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.chart[open] summary, details.table[open] summary { margin-bottom: 8px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>IPDR assistant</h1>
    <p>Ask a question, then keep going. A follow-up keeps the previous filters. Mark an answer correct and the assistant learns from that answer.</p>
  </div>
  <button type="button" class="debug-toggle" id="debug-toggle" aria-pressed="false">Debug off</button>
</header>
<main>
  <div class="status" id="status"></div>
  <div class="transcript" id="transcript"></div>
  <form id="ask-form">
    <label for="question" id="question-label">Question</label>
    <textarea id="question" name="question" placeholder="Example: top app labels by download bytes yesterday"></textarea>
    <div class="row">
      <label for="engine">AI engine</label>
      <select id="engine" name="engine">
        <option value="local" data-kind="llama.cpp">Local 7B</option>
        <option value="kaggle" data-kind="ollama">Kaggle 14B</option>
      </select>
      <button type="submit" id="ask">Ask</button>
      <button type="button" class="secondary" id="reset">New conversation</button>
      <span id="busy" class="hidden">Working. A local question often takes half a minute to two minutes.</span>
    </div>
  </form>
  <div class="starters" id="starters"></div>
</main>
<script>
const question = document.getElementById("question");
const form = document.getElementById("ask-form");
const askButton = document.getElementById("ask");
const busy = document.getElementById("busy");
const transcript = document.getElementById("transcript");
const history = [];
let lastAnswer = null;

function chartDisplayRequest(text) {
  const question = text.toLowerCase();
  // Re-render the last result only for pure chart-type asks ("pie chart", "show as graph").
  if (!/\b(bar chart|pie chart|line chart|chart|graph)\b/.test(question)) return false;
  // Time series / subject asks need new SQL — do not reuse the previous table.
  if (/\b(timeline|time\s*graphs?|time\s*charts?|over time|trend|hourly|daily|minutely|by hour|by day|by minute|per minute|each minute)\b/.test(question)) return false;
  if (/\b(usage|pattern)\b/.test(question)) return false;
  if (/\b(top|highest|most|maximum|list|which|who|from|where|between|yesterday|today|application|applications|website|websites|city|cities|subscriber)\b/.test(question)) return false;
  return true;
}

function pill(text, kind) {
  const span = document.createElement("span");
  span.className = "pill" + (kind ? " " + kind : "");
  span.textContent = text;
  return span;
}

async function loadHealth() {
  const status = document.getElementById("status");
  status.replaceChildren();
  try {
    const response = await fetch("/api/health");
    const data = await response.json();
    const llama = data.llama || {};
    status.append(
      pill(data.mysql.ok ? "MySQL " + data.mysql.host : "MySQL down", data.mysql.ok ? "ok" : "bad"),
      pill(llama.ok ? (llama.label || "Local") + " · " + (llama.model || "") : "local model not ready", llama.ok ? "ok" : "bad"),
      pill(data.examples + " examples"),
      pill((data.learned || 0) + " learned"),
      pill(data.missing_time === "all" ? "learned: no time range uses whole table" : "no time range: asks until marked"),
      pill(data.labels + " app labels"),
      pill(data.time.note)
    );
    if (!data.mysql.ok) status.append(pill(data.mysql.detail, "bad"));
    if (llama.ok === false) status.append(pill(llama.detail, "bad"));
    const engines = Array.isArray(data.engines) ? data.engines : [];
    fillEngines(engines);
    if (!engines.length) status.append(pill("Engine list is missing. Restart ipdr-assistant, then reload.", "bad"));
    for (const engine of engines) {
      if (engine.id !== "local" && !engine.ok) status.append(pill(engine.label + " is not reachable", "bad"));
    }
    if (data.mapping_error) status.append(pill(data.mapping_error, "bad"));
  } catch (error) {
    status.append(pill(String(error), "bad"));
  }
}

async function loadStarters() {
  const box = document.getElementById("starters");
  const response = await fetch("/api/starters");
  const data = await response.json();
  for (const text of data.questions) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", () => {
      resetConversation();
      question.value = text;
      form.requestSubmit();
    });
    box.append(button);
  }
}

function fillEngines(engines) {
  if (!engines.length) return;
  const menu = document.getElementById("engine");
  const selected = menu.value;
  menu.replaceChildren();
  for (const engine of engines) {
    const option = document.createElement("option");
    option.value = engine.id;
    option.textContent = engine.label;
    option.dataset.kind = engine.kind;
    menu.append(option);
  }
  if (selected && menu.querySelector(`option[value="${selected}"]`)) menu.value = selected;
}

function addUserBubble(text) {
  const bubble = document.createElement("div");
  bubble.className = "bubble user";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "You";
  const body = document.createElement("div");
  body.textContent = text;
  bubble.append(who, body);
  transcript.append(bubble);
}

const CHART_COLORS = ["#0c5c48", "#c4841d", "#1f6f8b", "#8d3b3b", "#4d6b3c", "#6b4c7a", "#b65c38", "#3d5a4c"];

const LABEL_COLUMNS = new Set([
  "subscriber_id", "app_label", "app_category", "requested_server", "city", "loc", "geo",
  "client_asn", "server_asn", "client_location", "server_location", "block_type"
]);

const TIME_COLUMNS = new Set([
  "start_time", "end_time", "recv_time", "hour_gmt5", "day_gmt5", "minute_gmt5",
  "hour", "day", "date", "minute", "bucket", "time_bucket", "period", "start_gmt5", "end_gmt5"
]);

function numberValue(value) {
  if (typeof value === "number" && Number.isFinite(value)) return value;
  if (typeof value !== "string") return null;
  const text = value.trim();
  if (!/^-?\d+(\.\d+)?$/.test(text) || /^0\d/.test(text)) return null;
  return Number(text);
}

function timeColumn(columns) {
  return columns.find((column) => TIME_COLUMNS.has(String(column).toLowerCase())) || null;
}

function isTimelineQuestion(question, sql, columns) {
  const text = String(question || "").toLowerCase();
  if (/\b(timeline|time\s*graphs?|time\s*charts?|over time|trend|hourly|daily|minutely|by hour|by day|by minute|per minute|each minute|every minute|against each minute|timestamps?)\b/.test(text)) return true;
  if (/\bgroup\s+by\s+(day_gmt5|hour_gmt5|minute_gmt5|date|hour|day|minute)\b/i.test(String(sql || ""))) return true;
  return !!timeColumn(columns);
}

function timeSortKey(value) {
  if (value == null || value === "") return Number.POSITIVE_INFINITY;
  if (value instanceof Date) return value.getTime();
  if (typeof value === "number" && Number.isFinite(value)) {
    return value < 1e12 ? value * 1000 : value;
  }
  const text = String(value).trim();
  if (/^\d{10}$/.test(text)) return Number(text) * 1000;
  if (/^\d{13}$/.test(text)) return Number(text);
  const parsed = Date.parse(text.includes("T") ? text : text.replace(" ", "T"));
  if (!Number.isNaN(parsed)) return parsed;
  return text;
}

function numericColumns(columns, rows) {
  return columns.filter((column) => {
    const name = String(column).toLowerCase();
    if (LABEL_COLUMNS.has(name) || TIME_COLUMNS.has(name)) return false;
    const values = rows
      .map((row) => row[column])
      .filter((value) => value !== null && value !== undefined && String(value).trim() !== "");
    return values.length > 0 && values.every((value) => numberValue(value) !== null);
  });
}

function columnByName(numeric, names) {
  for (const wanted of names) {
    const found = numeric.find((column) => column.toLowerCase() === wanted);
    if (found) return found;
  }
  return null;
}

function namedMeasures(question, numeric) {
  const text = String(question || "");
  const rules = [
    {pattern: /\b(flow counts?|number of flows|hits)\b/gi, names: ["flow_count", "flows", "blocked_flows"]},
    {pattern: /\bflows\b/gi, names: ["flows", "flow_count", "blocked_flows"]},
    {pattern: /\b(traffic volume|volume|bytes|megabytes|total mb)\b/gi, names: ["traffic_volume_mb", "total_mb", "traffic_volume_gb", "total_gb", "traffic_volume_tb", "total_tb", "traffic_volume", "total_bytes"]},
    {pattern: /\b(user counts?|unique users|subscribers|users)\b/gi, names: ["users"]},
    {pattern: /\bwebsites\b/gi, names: ["websites"]}
  ];
  const found = [];
  for (const rule of rules) {
    const pattern = new RegExp(rule.pattern.source, "gi");
    let match;
    while ((match = pattern.exec(text))) {
      const column = columnByName(numeric, rule.names);
      if (column && !found.some((item) => item.column === column)) found.push({index: match.index, column});
    }
  }
  found.sort((left, right) => left.index - right.index);
  return found.map((item) => item.column);
}

function measureFromQuestion(question, numeric) {
  const named = namedMeasures(question, numeric);
  return named.length === 1 ? named[0] : null;
}

function measureFromSql(sql, numeric) {
  const match = String(sql || "").match(/\border\s+by\s+`?([a-zA-Z0-9_]+)`?/i);
  if (!match) return null;
  return columnByName(numeric, [match[1].toLowerCase()]);
}

function chartFields(columns, rows, question, sql) {
  const numeric = numericColumns(columns, rows);
  const timeline = isTimelineQuestion(question, sql, columns);
  const label = timeColumn(columns)
    || columns.find((column) => LABEL_COLUMNS.has(String(column).toLowerCase()))
    || columns.find((column) => !numeric.includes(column));
  if (!label || !numeric.length) return null;
  const preferred = ["flows", "flow_count", "blocked_flows", "users", "websites", "traffic_volume_mb", "total_mb", "traffic_volume_gb", "total_gb", "traffic_volume", "total_bytes"];
  const named = namedMeasures(question, numeric);
  const measure = (named.length === 1 ? named[0] : null) || measureFromSql(sql, numeric) || named[named.length - 1] || preferred.find((name) => numeric.includes(name)) || numeric[0];
  return {label, measure, numeric, timeline};
}

function chartRows(rows, measure, fields) {
  if (fields && fields.timeline) {
    return rows.slice().sort((left, right) => {
      const a = timeSortKey(left[fields.label]);
      const b = timeSortKey(right[fields.label]);
      if (typeof a === "number" && typeof b === "number") return a - b;
      if (a === b) return 0;
      return a < b ? -1 : 1;
    }).slice(0, 200);
  }
  return rows
    .slice()
    .sort((left, right) => (numberValue(right[measure]) || 0) - (numberValue(left[measure]) || 0))
    .slice(0, 20);
}

const MEASURE_LABELS = {
  total_bytes: "Total bytes",
  total_mb: "Total MB",
  total_gb: "Total GB",
  total_tb: "Total TB",
  flows: "Flows",
  flow_count: "Flow count",
  blocked_flows: "Blocked flows",
  allowed_flows: "Allowed flows",
  users: "Users",
  websites: "Websites",
  traffic_volume: "Traffic volume",
  traffic_volume_mb: "Traffic volume (MB)",
  traffic_volume_gb: "Traffic volume (GB)",
  traffic_volume_tb: "Traffic volume (TB)",
  duration: "Duration (ms)",
  duration_seconds: "Duration (sec)",
  duration_minutes: "Duration (min)",
  duration_hours: "Duration (hr)"
};

function measureLabel(column) {
  return MEASURE_LABELS[column] || column.replace(/_/g, " ");
}

function choiceButton(label) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "secondary";
  button.textContent = label;
  return button;
}

function chartCard(columns, rows, question, sql, kind) {
  const fields = chartFields(columns, rows, question, sql);
  const card = document.createElement("details");
  card.className = "chart";
  card.open = true;
  const summary = document.createElement("summary");
  summary.textContent = "Chart";
  card.append(summary);
  if (!fields) return card;
  const controls = document.createElement("div");
  controls.className = "chart-controls";
  const measureButtons = fields.numeric.map((column) => {
    const button = choiceButton(measureLabel(column));
    button.dataset.measure = column;
    button.addEventListener("click", () => {
      fields.measure = column;
      draw(currentKind);
    });
    return button;
  });
  const barButton = choiceButton("Bar");
  const pieButton = choiceButton("Pie");
  const lineButton = choiceButton("Line");
  const plot = document.createElement("div");
  plot.className = "chart-plot";
  const tooltip = document.createElement("div");
  tooltip.className = "chart-tooltip";
  const note = document.createElement("p");
  note.className = "chart-note";
  let currentKind = kind === "pie" ? "pie" : kind === "line" || fields.timeline ? "line" : "bar";
  function draw(nextKind) {
    currentKind = nextKind;
    const shown = chartRows(rows, fields.measure, fields);
    const label = measureLabel(fields.measure);
    for (const button of measureButtons) button.classList.toggle("active", button.dataset.measure === fields.measure);
    barButton.classList.toggle("active", nextKind === "bar");
    pieButton.classList.toggle("active", nextKind === "pie");
    lineButton.classList.toggle("active", nextKind === "line");
    tooltip.classList.remove("visible");
    tooltip.replaceChildren();
    const chart = nextKind === "pie"
      ? pieChart(shown, fields, tooltip)
      : nextKind === "line"
        ? lineChart(shown, fields, tooltip)
        : barChart(shown, fields, tooltip);
    plot.replaceChildren(chart, tooltip);
    if (fields.timeline || nextKind === "line") {
      note.textContent = rows.length > shown.length
        ? "Timeline of " + shown.length + " of " + rows.length + " buckets, by " + label + "."
        : "Timeline by " + label + ", oldest to newest.";
    } else {
      note.textContent = rows.length > shown.length
        ? "Largest " + shown.length + " of " + rows.length + " rows, by " + label + "."
        : "Ordered by " + label + ", largest first.";
    }
  }
  barButton.addEventListener("click", () => draw("bar"));
  pieButton.addEventListener("click", () => draw("pie"));
  lineButton.addEventListener("click", () => draw("line"));
  const typeButtons = fields.timeline ? [lineButton, barButton] : [barButton, pieButton, lineButton];
  controls.append(
    controlRow("Chart type", typeButtons),
    controlRow("Measure", measureButtons)
  );
  card.append(controls, plot, note);
  draw(currentKind);
  return card;
}

function controlRow(name, buttons) {
  const row = document.createElement("div");
  row.className = "chart-row";
  const label = document.createElement("span");
  label.textContent = name;
  const choices = document.createElement("div");
  choices.className = "choices";
  choices.append(...buttons);
  row.append(label, choices);
  return row;
}

function tooltipHtml(fields, row, value, extra) {
  const title = document.createElement("strong");
  title.textContent = String(row[fields.label] ?? "");
  const body = document.createElement("div");
  body.textContent = measureLabel(fields.measure) + ": " + String(value);
  const parts = [title, body];
  if (extra) {
    const more = document.createElement("div");
    more.textContent = extra;
    parts.push(more);
  }
  return parts;
}

function positionTooltip(tooltip, event, plot) {
  const bounds = plot.getBoundingClientRect();
  const x = Math.min(Math.max(event.clientX - bounds.left, 24), bounds.width - 24);
  const y = Math.min(Math.max(event.clientY - bounds.top, 12), bounds.height - 12);
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

function bindChartHover(svg, tooltip, hits) {
  const plot = tooltip.parentElement;
  function hide() {
    svg.classList.remove("is-hovering");
    for (const hit of hits) {
      hit.el.classList.remove("is-active");
      if (hit.activate) hit.activate(false);
    }
    tooltip.classList.remove("visible");
  }
  for (const hit of hits) {
    hit.el.classList.add("chart-hit");
    hit.el.addEventListener("pointerenter", (event) => {
      svg.classList.add("is-hovering");
      for (const other of hits) {
        const on = other === hit;
        other.el.classList.toggle("is-active", on);
        if (other.activate) other.activate(on);
      }
      tooltip.replaceChildren(...hit.content());
      tooltip.classList.add("visible");
      positionTooltip(tooltip, event, plot);
    });
    hit.el.addEventListener("pointermove", (event) => positionTooltip(tooltip, event, plot));
    hit.el.addEventListener("pointerleave", hide);
  }
  svg.addEventListener("pointerleave", hide);
}

function barChart(rows, fields, tooltip) {
  const width = 720;
  const rowHeight = 28;
  const labelWidth = 168;
  const height = rows.length * rowHeight + 16;
  const values = rows.map((row) => Math.max(0, numberValue(row[fields.measure]) || 0));
  const max = Math.max(...values, 1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("class", "chart-svg");
  const hits = [];
  rows.forEach((row, index) => {
    const value = values[index];
    const y = 8 + index * rowHeight;
    const barWidth = ((width - labelWidth - 88) * value) / max;
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", "0");
    label.setAttribute("y", String(y + 16));
    label.setAttribute("fill", "#1b1914");
    label.setAttribute("font-size", "12");
    label.textContent = String(row[fields.label] ?? "").slice(0, 24);
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", String(labelWidth));
    rect.setAttribute("y", String(y));
    rect.setAttribute("width", String(Math.max(barWidth, 2)));
    rect.setAttribute("height", "18");
    rect.setAttribute("rx", "4");
    rect.setAttribute("fill", CHART_COLORS[index % CHART_COLORS.length]);
    const amount = document.createElementNS("http://www.w3.org/2000/svg", "text");
    amount.setAttribute("x", String(labelWidth + barWidth + 8));
    amount.setAttribute("y", String(y + 14));
    amount.setAttribute("fill", "#5c564c");
    amount.setAttribute("font-size", "12");
    amount.textContent = String(row[fields.measure]);
    svg.append(label, rect, amount);
    hits.push({
      el: rect,
      content: () => tooltipHtml(fields, row, row[fields.measure])
    });
  });
  bindChartHover(svg, tooltip, hits);
  return svg;
}

function pieChart(rows, fields, tooltip) {
  const values = rows.map((row) => Math.max(0, numberValue(row[fields.measure]) || 0));
  const total = values.reduce((sum, value) => sum + value, 0) || 1;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 720 280");
  svg.setAttribute("class", "chart-svg");
  let angle = -Math.PI / 2;
  const hits = [];
  values.forEach((value, index) => {
    const slice = (value / total) * Math.PI * 2;
    const end = angle + slice;
    const large = slice > Math.PI ? 1 : 0;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const x1 = 120 + Math.cos(angle) * 90;
    const y1 = 140 + Math.sin(angle) * 90;
    const x2 = 120 + Math.cos(end) * 90;
    const y2 = 140 + Math.sin(end) * 90;
    path.setAttribute("d", `M 120 140 L ${x1} ${y1} A 90 90 0 ${large} 1 ${x2} ${y2} Z`);
    path.setAttribute("fill", CHART_COLORS[index % CHART_COLORS.length]);
    svg.append(path);
    const legend = document.createElementNS("http://www.w3.org/2000/svg", "text");
    legend.setAttribute("x", "240");
    legend.setAttribute("y", String(36 + index * 22));
    legend.setAttribute("fill", "#1b1914");
    legend.setAttribute("font-size", "13");
    const share = Math.round((value / total) * 100);
    legend.textContent = String(rows[index][fields.label] ?? "").slice(0, 32) + " · " + share + "%";
    const swatch = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    swatch.setAttribute("x", "220");
    swatch.setAttribute("y", String(24 + index * 22));
    swatch.setAttribute("width", "12");
    swatch.setAttribute("height", "12");
    swatch.setAttribute("rx", "2");
    swatch.setAttribute("fill", CHART_COLORS[index % CHART_COLORS.length]);
    svg.append(swatch, legend);
    hits.push({
      el: path,
      content: () => tooltipHtml(fields, rows[index], rows[index][fields.measure], share + "% of total")
    });
    angle = end;
  });
  bindChartHover(svg, tooltip, hits);
  return svg;
}

function formatTick(value) {
  const text = String(value ?? "");
  if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 16).replace("T", " ");
  if (/^\d{10}$/.test(text)) {
    const date = new Date(Number(text) * 1000);
    if (!Number.isNaN(date.getTime())) {
      return date.toISOString().slice(0, 16).replace("T", " ");
    }
  }
  return text.slice(0, 16);
}

function lineChart(rows, fields, tooltip) {
  const width = 720;
  const height = 280;
  const left = 56;
  const right = 16;
  const top = 20;
  const bottom = 48;
  const values = rows.map((row) => Math.max(0, numberValue(row[fields.measure]) || 0));
  const max = Math.max(...values, 1);
  const span = Math.max(rows.length - 1, 1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("class", "chart-svg");
  const axis = document.createElementNS("http://www.w3.org/2000/svg", "line");
  axis.setAttribute("x1", String(left));
  axis.setAttribute("y1", String(height - bottom));
  axis.setAttribute("x2", String(width - right));
  axis.setAttribute("y2", String(height - bottom));
  axis.setAttribute("stroke", "#c9c2b5");
  svg.append(axis);
  const yAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
  yAxis.setAttribute("x1", String(left));
  yAxis.setAttribute("y1", String(top));
  yAxis.setAttribute("x2", String(left));
  yAxis.setAttribute("y2", String(height - bottom));
  yAxis.setAttribute("stroke", "#c9c2b5");
  svg.append(yAxis);
  const points = rows.map((row, index) => {
    const x = left + ((width - left - right) * index) / span;
    const y = height - bottom - ((height - top - bottom) * values[index]) / max;
    return {x, y, row, value: values[index]};
  });
  if (points.length) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute(
      "d",
      points.map((point, index) => `${index ? "L" : "M"} ${point.x} ${point.y}`).join(" ")
    );
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", CHART_COLORS[0]);
    path.setAttribute("stroke-width", "2.5");
    svg.append(path);
  }
  const hits = [];
  points.forEach((point) => {
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", String(point.x));
    dot.setAttribute("cy", String(point.y));
    dot.setAttribute("r", "3.5");
    dot.setAttribute("fill", CHART_COLORS[0]);
    // Fat transparent stroke widens the hover target without cluttering the line.
    dot.setAttribute("stroke", "transparent");
    dot.setAttribute("stroke-width", "16");
    svg.append(dot);
    hits.push({
      el: dot,
      content: () => tooltipHtml(fields, point.row, point.row[fields.measure]),
      activate(on) {
        dot.setAttribute("r", on ? "6.5" : "3.5");
      }
    });
  });
  const tickIndexes = points.length <= 8
    ? points.map((_, index) => index)
    : [0, Math.floor(span / 3), Math.floor((2 * span) / 3), span];
  for (const index of new Set(tickIndexes)) {
    const point = points[index];
    if (!point) continue;
    const tick = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tick.setAttribute("x", String(point.x));
    tick.setAttribute("y", String(height - 18));
    tick.setAttribute("text-anchor", "middle");
    tick.setAttribute("fill", "#5c564c");
    tick.setAttribute("font-size", "11");
    tick.textContent = formatTick(point.row[fields.label]);
    svg.append(tick);
  }
  const topLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
  topLabel.setAttribute("x", "8");
  topLabel.setAttribute("y", String(top + 4));
  topLabel.setAttribute("fill", "#5c564c");
  topLabel.setAttribute("font-size", "11");
  topLabel.textContent = String(max);
  svg.append(topLabel);
  bindChartHover(svg, tooltip, hits);
  return svg;
}

let debugMode = localStorage.getItem("ipdr-debug") === "1";

function formatStepMs(ms) {
  if (ms < 1000) return Math.round(ms) + " ms";
  return (ms / 1000).toFixed(ms >= 10000 ? 0 : 1) + " s";
}

function syncDebugToggle() {
  const button = document.getElementById("debug-toggle");
  if (!button) return;
  button.classList.toggle("on", debugMode);
  button.setAttribute("aria-pressed", debugMode ? "true" : "false");
  button.textContent = debugMode ? "Debug on" : "Debug off";
  // Turning debug off removes existing debug panels from the transcript.
  if (!debugMode) {
    for (const bubble of transcript.querySelectorAll(".bubble.debug-log")) {
      bubble.remove();
    }
  }
}

function startProgress() {
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (debugMode ? " debug-log" : "");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = debugMode ? "Debug steps" : "Assistant";
  const list = document.createElement("ol");
  list.className = "steps";
  bubble.append(who, list);
  transcript.append(bubble);
  bubble.scrollIntoView({block: "nearest"});
  let lastAt = performance.now();
  let currentItem = null;
  function stampPrevious() {
    if (!currentItem) return;
    const elapsed = performance.now() - lastAt;
    let time = currentItem.querySelector(".step-time");
    if (!time) {
      time = document.createElement("span");
      time.className = "step-time";
      currentItem.append(time);
    }
    time.textContent = formatStepMs(elapsed);
  }
  return {
    add(text) {
      stampPrevious();
      for (const item of list.querySelectorAll("li")) item.classList.remove("current");
      const step = document.createElement("li");
      step.className = "current";
      const label = document.createElement("span");
      label.textContent = text;
      step.append(label);
      list.append(step);
      currentItem = step;
      lastAt = performance.now();
    },
    finish() {
      stampPrevious();
      for (const item of list.querySelectorAll("li")) item.classList.remove("current");
      if (debugMode) {
        who.textContent = "Debug steps";
        bubble.classList.add("debug-log");
      } else {
        bubble.remove();
      }
    }
  };
}

function addAnswerBubble(asked, data) {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "Assistant";
  bubble.append(who);
  if (data.warning) {
    const warning = document.createElement("div");
    warning.className = "warning";
    warning.textContent = data.warning;
    bubble.append(warning);
  }
  if (data.error) {
    const error = document.createElement("div");
    error.className = "error";
    error.textContent = data.error;
    bubble.append(error);
  }
  if (data.confirm && data.plan) {
    bubble.append(confirmPlanCard(data.plan));
  } else {
    const text = document.createElement("div");
    text.textContent = data.explanation || data.clarify || "";
    bubble.append(text);
  }
  if (data.confirm && data.pending_sql) {
    const preview = document.createElement("details");
    preview.className = "sql";
    const summary = document.createElement("summary");
    summary.textContent = "SQL preview";
    const sql = document.createElement("pre");
    sql.textContent = data.pending_sql;
    preview.append(summary, sql);
    bubble.append(preview);
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "10px";
    const accept = document.createElement("button");
    accept.type = "button";
    accept.textContent = "Accept";
    accept.addEventListener("click", () => acceptPendingQuery(accept, row));
    const change = document.createElement("button");
    change.type = "button";
    change.className = "secondary";
    change.textContent = "Change";
    change.addEventListener("click", () => {
      accept.disabled = true;
      change.disabled = true;
      document.getElementById("question-label").textContent = "Change";
      question.placeholder = "What should I change about those conditions?";
      question.focus();
    });
    row.append(accept, change);
    bubble.append(row);
  }
  if (data.columns && data.columns.length && data.rows && data.rows.length) {
    bubble.append(chartCard(
      data.columns,
      data.rows,
      data.chartQuestion || asked,
      data.sql,
      /\bpie\b/i.test(asked)
        ? "pie"
        : /\b(timeline|time\s*graphs?|time\s*charts?|over time|trend|line|timestamps?|hourly|minutely|per minute|each minute|by minute)\b/i.test(asked)
          ? "line"
          : "bar"
    ));
    if (!data.chartQuestion) lastAnswer = {question: asked, data};
  }
  if (data.sql) {
    const details = document.createElement("details");
    details.className = "sql";
    const summary = document.createElement("summary");
    summary.textContent = "SQL";
    const sql = document.createElement("pre");
    sql.textContent = data.sql;
    details.append(summary, sql);
    bubble.append(details);
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "10px";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "secondary";
    copy.textContent = "Copy SQL";
    copy.addEventListener("click", () => navigator.clipboard.writeText(data.sql));
    const learn = document.createElement("button");
    learn.type = "button";
    learn.className = "secondary";
    learn.textContent = "Mark correct";
    learn.addEventListener("click", () => markCorrect(asked, data.sql, learn));
    row.append(copy, learn);
    bubble.append(row);
  }
  if (data.columns && data.columns.length && data.rows && data.rows.length) {
    const details = document.createElement("details");
    details.className = "table";
    details.open = true;
    const summary = document.createElement("summary");
    summary.textContent = "Table (" + data.rows.length + " row" + (data.rows.length === 1 ? "" : "s") + ")";
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    const table = document.createElement("table");
    const head = document.createElement("tr");
    const numberHead = document.createElement("th");
    numberHead.textContent = "#";
    head.append(numberHead);
    for (const column of data.columns) {
      const cell = document.createElement("th");
      cell.textContent = column;
      head.append(cell);
    }
    table.append(head);
    data.rows.forEach((record, index) => {
      const line = document.createElement("tr");
      const number = document.createElement("td");
      number.textContent = String(index + 1);
      line.append(number);
      for (const column of data.columns) {
        const cell = document.createElement("td");
        const value = record[column];
        cell.textContent = value === null || value === undefined ? "" : String(value);
        if (typeof value === "number") cell.className = "num";
        line.append(cell);
      }
      table.append(line);
    });
    wrap.append(table);
    details.append(summary, wrap);
    bubble.append(details);
  }
  transcript.append(bubble);
  bubble.scrollIntoView({block: "nearest"});
}

async function markCorrect(asked, sql, button) {
  button.disabled = true;
  try {
    const questions = history.filter((turn) => !turn.sql).map((turn) => turn.question);
    questions.push(asked);
    const response = await fetch("/api/learn", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: asked, sql, questions})
    });
    const data = await response.json();
    if (!response.ok) {
      button.disabled = false;
      button.textContent = data.detail || "Could not save";
      return;
    }
    const savedText = data.learned_time_rule
      ? "Saved. A question with no time range now runs on all of the data."
      : "Saved. The same question will run this query.";
    button.replaceWith(Object.assign(document.createElement("span"), {className: "saved", textContent: savedText}));
    loadHealth();
  } catch (error) {
    button.disabled = false;
    button.textContent = String(error);
  }
}

function detailText(detail) {
  if (!detail) return "Request failed";
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    return detail.map((item) => (item && item.msg) || JSON.stringify(item)).join(" ");
  }
  return JSON.stringify(detail);
}

function resetConversation() {
  history.length = 0;
  lastAnswer = null;
  transcript.replaceChildren();
  document.getElementById("question-label").textContent = "Question";
  question.placeholder = "Example: top app labels by download bytes yesterday";
}

function confirmPlanCard(plan) {
  const card = document.createElement("div");
  card.className = "confirm-card";
  const lead = document.createElement("p");
  lead.className = "confirm-lead";
  lead.textContent = "I am going to run a query for:";
  card.append(lead);
  if (plan.title) {
    const ask = document.createElement("div");
    ask.className = "confirm-ask";
    ask.textContent = plan.title;
    card.append(ask);
  }
  const conditionsTitle = document.createElement("h3");
  conditionsTitle.textContent = "Conditions";
  card.append(conditionsTitle);
  const grid = document.createElement("dl");
  grid.className = "confirm-grid";
  for (const item of plan.conditions || []) {
    const dt = document.createElement("dt");
    dt.textContent = item.label;
    const dd = document.createElement("dd");
    dd.textContent = item.value;
    grid.append(dt, dd);
  }
  card.append(grid);
  const columnsTitle = document.createElement("h3");
  columnsTitle.textContent = "Columns shown";
  card.append(columnsTitle);
  const columns = document.createElement("ul");
  columns.className = "confirm-columns";
  const names = (plan.columns && plan.columns.length) ? plan.columns : ["(none detected)"];
  for (const name of names) {
    const li = document.createElement("li");
    li.textContent = name;
    columns.append(li);
  }
  card.append(columns);
  const foot = document.createElement("p");
  foot.className = "confirm-foot";
  foot.textContent = plan.footer || "Accept to run it, or Change if this is wrong.";
  card.append(foot);
  return card;
}

function historyPayload() {
  return history.slice(-12).map((turn) => ({
    question: turn.question,
    sql: (turn.sql || "").slice(0, 100000),
    explanation: (turn.explanation || "").slice(0, 2000),
    pending_sql: (turn.pending_sql || "").slice(0, 100000)
  }));
}

function rememberTurn(asked, data) {
  if (data.error) return;
  history.push({
    question: asked,
    sql: data.sql || "",
    explanation: data.explanation || data.clarify || data.error || "",
    pending_sql: data.pending_sql || ""
  });
  if (data.confirm) {
    document.getElementById("question-label").textContent = "Confirm";
    question.placeholder = "Accept to run, or say what to change";
  } else {
    document.getElementById("question-label").textContent = "Follow-up";
    question.placeholder = "Ask about the same result, or change one part of it";
  }
}

async function runAsk(text, options = {}) {
  const accept = Boolean(options.accept);
  const prior = historyPayload();
  const menu = document.getElementById("engine");
  askButton.disabled = true;
  busy.classList.add("hidden");
  const progress = startProgress();
  progress.add(accept ? "Running the confirmed query" : "Sending the question");
  try {
    const response = await fetch("/api/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        question: text,
        history: prior,
        engine: menu.value || "local",
        debug: debugMode,
        accept
      })
    });
    const type = response.headers.get("content-type") || "";
    if (!type.includes("ndjson")) {
      const raw = await response.text();
      progress.finish();
      let data;
      try { data = JSON.parse(raw); } catch (error) {
        addAnswerBubble(text, {error: raw.slice(0, 500) || String(error), explanation: ""});
        return;
      }
      const payload = !response.ok ? {error: detailText(data.detail), explanation: ""} : data;
      addAnswerBubble(text, payload);
      rememberTurn(text, payload);
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let result = null;
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === "status") progress.add(event.text);
        if (event.type === "done") result = event.result;
      }
    }
    progress.finish();
    const data = result || {error: "The assistant stopped before returning an answer.", explanation: ""};
    addAnswerBubble(text, data);
    rememberTurn(text, data);
  } catch (error) {
    progress.finish();
    addAnswerBubble(text, {error: String(error), explanation: ""});
  } finally {
    askButton.disabled = false;
    busy.classList.add("hidden");
    question.focus();
  }
}

async function acceptPendingQuery(acceptButton, row) {
  if (askButton.disabled) return;
  for (const button of row.querySelectorAll("button")) button.disabled = true;
  addUserBubble("Accept");
  await runAsk("Accept", {accept: true});
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = question.value.trim();
  if (!text) return;
  addUserBubble(text);
  question.value = "";
  if (chartDisplayRequest(text) && lastAnswer && lastAnswer.data.rows && lastAnswer.data.rows.length) {
    addAnswerBubble(text, {
      explanation: "This charts the rows already shown.",
      columns: lastAnswer.data.columns,
      rows: lastAnswer.data.rows,
      sql: lastAnswer.data.sql,
      chartQuestion: lastAnswer.question + "\n" + text
    });
    question.focus();
    return;
  }
  await runAsk(text);
});

document.getElementById("reset").addEventListener("click", resetConversation);
document.getElementById("debug-toggle").addEventListener("click", () => {
  debugMode = !debugMode;
  localStorage.setItem("ipdr-debug", debugMode ? "1" : "0");
  syncDebugToggle();
});
syncDebugToggle();

loadHealth();
loadStarters();
</script>
