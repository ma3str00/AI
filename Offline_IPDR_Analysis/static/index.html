<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPDR assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f1ea;
    --ink: #1c1915;
    --muted: #5e584f;
    --line: #d9d2c5;
    --panel: #fffcf7;
    --accent: #0f6e56;
    --accent-ink: #ffffff;
    --warn: #8a4b08;
    --warn-bg: #fff4e5;
    --bad: #8d1d1d;
    --bad-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.45 "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.03em; }
  h2 { font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .lede { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .pill.bad { background: var(--bad-bg); border-color: #f0c4c4; color: var(--bad); }
  .pill.ok { border-color: #b7d8ce; }
  form { display: grid; gap: 10px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    font: inherit; color: inherit;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 16px; font: inherit; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; }
  .starters button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-size: 13px; padding: 6px 10px; }
  section { margin-top: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .warning { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 13px/1.4 ui-monospace, Consolas, monospace;
  }
  .table-wrap { overflow: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: #efeae1; }
  .hidden { display: none; }
  .transcript { display: grid; gap: 14px; margin-top: 8px; }
  .bubble { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
  .bubble.user { background: #efeae1; }
  .who { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .bubble pre { margin-top: 10px; }
  .saved { color: var(--accent); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>IPDR assistant</h1>
  <p class="lede">Ask a question, then keep going. A follow-up keeps the previous filters. Mark an answer correct and that same question runs the saved query next time.</p>
  <div class="status" id="status"></div>
  <div class="transcript" id="transcript"></div>
  <form id="ask-form">
    <label for="question" id="question-label">Question</label>
    <textarea id="question" name="question" placeholder="Example: top app labels by download bytes yesterday"></textarea>
    <div class="row">
      <button type="submit" id="ask">Ask</button>
      <button type="button" class="secondary" id="reset">New conversation</button>
      <span id="busy" class="hidden">Working on CPU. A question often takes half a minute to two minutes.</span>
    </div>
  </form>
  <div class="starters" id="starters"></div>
</main>
<script>
const question = document.getElementById("question");
const form = document.getElementById("ask-form");
const askButton = document.getElementById("ask");
const busy = document.getElementById("busy");
const transcript = document.getElementById("transcript");
const history = [];

function pill(text, kind) {
  const span = document.createElement("span");
  span.className = "pill" + (kind ? " " + kind : "");
  span.textContent = text;
  return span;
}

async function loadHealth() {
  const status = document.getElementById("status");
  status.replaceChildren();
  try {
    const response = await fetch("/api/health");
    const data = await response.json();
    status.append(
      pill(data.mysql.ok ? "MySQL " + data.mysql.host : "MySQL down", data.mysql.ok ? "ok" : "bad"),
      pill(data.llama.ok ? data.llama.model : "llama-server not ready", data.llama.ok ? "ok" : "bad"),
      pill(data.examples + " examples"),
      pill((data.learned || 0) + " learned"),
      pill(data.labels + " app labels"),
      pill(data.time.note)
    );
    if (!data.mysql.ok) status.append(pill(data.mysql.detail, "bad"));
    if (!data.llama.ok) status.append(pill(data.llama.detail, "bad"));
    if (data.mapping_error) status.append(pill(data.mapping_error, "bad"));
  } catch (error) {
    status.append(pill(String(error), "bad"));
  }
}

async function loadStarters() {
  const box = document.getElementById("starters");
  const response = await fetch("/api/starters");
  const data = await response.json();
  for (const text of data.questions) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", () => {
      resetConversation();
      question.value = text;
      form.requestSubmit();
    });
    box.append(button);
  }
}

function addUserBubble(text) {
  const bubble = document.createElement("div");
  bubble.className = "bubble user";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "You";
  const body = document.createElement("div");
  body.textContent = text;
  bubble.append(who, body);
  transcript.append(bubble);
}

function addAnswerBubble(asked, data) {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "Assistant";
  bubble.append(who);
  if (data.warning) {
    const warning = document.createElement("div");
    warning.className = "warning";
    warning.textContent = data.warning;
    bubble.append(warning);
  }
  if (data.error) {
    const error = document.createElement("div");
    error.className = "error";
    error.textContent = data.error;
    bubble.append(error);
  }
  const text = document.createElement("div");
  text.textContent = data.explanation || data.clarify || "";
  bubble.append(text);
  if (data.sql) {
    const sql = document.createElement("pre");
    sql.textContent = data.sql;
    bubble.append(sql);
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "10px";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "secondary";
    copy.textContent = "Copy SQL";
    copy.addEventListener("click", () => navigator.clipboard.writeText(data.sql));
    const learn = document.createElement("button");
    learn.type = "button";
    learn.className = "secondary";
    learn.textContent = "Mark correct";
    learn.addEventListener("click", () => markCorrect(asked, data.sql, learn));
    row.append(copy, learn);
    bubble.append(row);
  }
  if (data.columns && data.columns.length && data.rows && data.rows.length) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    wrap.style.marginTop = "10px";
    const table = document.createElement("table");
    const head = document.createElement("tr");
    for (const column of data.columns) {
      const cell = document.createElement("th");
      cell.textContent = column;
      head.append(cell);
    }
    table.append(head);
    for (const record of data.rows) {
      const line = document.createElement("tr");
      for (const column of data.columns) {
        const cell = document.createElement("td");
        const value = record[column];
        cell.textContent = value === null || value === undefined ? "" : String(value);
        line.append(cell);
      }
      table.append(line);
    }
    wrap.append(table);
    bubble.append(wrap);
  }
  transcript.append(bubble);
  bubble.scrollIntoView({block: "nearest"});
}

async function markCorrect(asked, sql, button) {
  button.disabled = true;
  try {
    const questions = history.filter((turn) => !turn.sql).map((turn) => turn.question);
    questions.push(asked);
    const response = await fetch("/api/learn", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: asked, sql, questions})
    });
    const data = await response.json();
    if (!response.ok) {
      button.disabled = false;
      button.textContent = data.detail || "Could not save";
      return;
    }
    button.replaceWith(Object.assign(document.createElement("span"), {className: "saved", textContent: "Saved. The same question will run this query."}));
    loadHealth();
  } catch (error) {
    button.disabled = false;
    button.textContent = String(error);
  }
}

function resetConversation() {
  history.length = 0;
  transcript.replaceChildren();
  document.getElementById("question-label").textContent = "Question";
  question.placeholder = "Example: top app labels by download bytes yesterday";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = question.value.trim();
  if (!text) return;
  const prior = history.map((turn) => ({
    question: turn.question,
    sql: turn.sql,
    explanation: turn.explanation
  }));
  addUserBubble(text);
  question.value = "";
  askButton.disabled = true;
  busy.classList.remove("hidden");
  try {
    const response = await fetch("/api/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, history: prior})
    });
    const data = await response.json();
    if (!response.ok) {
      addAnswerBubble(text, {error: data.detail || "Request failed", explanation: ""});
    } else {
      addAnswerBubble(text, data);
      history.push({
        question: text,
        sql: data.sql || "",
        explanation: data.explanation || data.clarify || data.error || ""
      });
      document.getElementById("question-label").textContent = "Follow-up";
      question.placeholder = "Ask about the same result, or change one part of it";
    }
  } catch (error) {
    addAnswerBubble(text, {error: String(error), explanation: ""});
  } finally {
    askButton.disabled = false;
    busy.classList.add("hidden");
    question.focus();
  }
});

document.getElementById("reset").addEventListener("click", resetConversation);

loadHealth();
loadStarters();
</script>
</body>
</html>
